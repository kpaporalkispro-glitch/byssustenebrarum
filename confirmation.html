<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Byssus Tenebrarum — bijoux et parures artisanales en micro-macramé."><title>Confirmation · Byssus Tenebrarum</title><link rel="icon" href="assets/images/favicon.jpg"><link rel="stylesheet" href="assets/css/style.css"></head><body data-page=""><div id="site-header"></div><section class="page-hero hero-small"><div class="wrap"><div class="page-hero-content"><div class="eyebrow">Confirmation</div><h1>Merci.</h1><p class="lead">Votre commande de démonstration a bien été enregistrée.</p></div></div></section><section class="section"><div class="wrap" id="confirmation-root"></div></section><div id="site-footer"></div><script src="assets/js/products.js"></script><script src="assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>setTimeout(renderConfirmation,0));function renderConfirmation(){const o=readStorageObject(BYSSUS_CONFIG.storageKeys.checkout);const root=document.getElementById('confirmation-root');if(!o.orderId){root.innerHTML='<div class="empty-state"><h2>Aucune commande trouvée</h2><a class="btn btn-primary" href="shop.html">Boutique</a></div>';return}archiveOrder(o);root.innerHTML=`<div class="card" style="max-width:900px;margin:auto"><div class="eyebrow">Commande enregistrée</div><h2>${o.orderId}</h2><p>Merci ${escapeHtml(o.customer.firstname)}. Votre sélection a été enregistrée dans ce navigateur.</p><div class="summary-line"><span>Livraison</span><strong>${o.delivery.name}</strong></div>${o.items.map(i=>{const p=getProductById(i.id);return p?`<div class="summary-line"><span>${p.name} × ${i.quantity}</span><strong>${formatPrice(p.price*i.quantity)}</strong></div>`:''}).join('')}<div class="summary-line total"><span>Total TTC</span><strong>${formatPrice(o.totals.total)}</strong></div><p class="muted">Pour un encaissement réel, connectez Stripe Checkout ou PayPal côté serveur. Aucune donnée bancaire n’est stockée ici.</p><div class="hero-actions"><a class="btn btn-primary" href="account.html">Mon compte</a><a class="btn" href="shop.html">Continuer mes achats</a></div></div>`;clearCart()}</script></body></html>
