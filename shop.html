<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Byssus Tenebrarum — bijoux et parures artisanales en micro-macramé."><title>Boutique · Byssus Tenebrarum</title><link rel="icon" href="assets/images/favicon.jpg"><link rel="stylesheet" href="assets/css/style.css"></head><body data-page="shop"><div id="site-header"></div><section class="page-hero hero-shop"><div class="wrap"><div class="page-hero-content"><div class="eyebrow">Boutique</div><h1>Bijoux & parures</h1><p class="lead">Du petit bijou symbolique à la parure corporelle : une même ligne, le fil, la pierre, le corps et le symbole.</p><div class="audience-tabs" id="audience-tabs"><button class="audience-tab active" data-audience="">Tous</button><button class="audience-tab" data-audience="femme">Femme</button><button class="audience-tab" data-audience="homme">Homme</button><button class="audience-tab" data-audience="unisexe">Unisexe</button><button class="audience-tab" data-audience="couple">Couple</button></div></div></div></section>
<section class="section"><div class="wrap shop-layout"><aside class="filters"><h3>Filtres</h3><div class="filter-group"><strong>Catégories</strong><div class="filter-list" id="cat-filters"></div></div><div class="filter-group"><strong>Univers</strong><div class="filter-list" id="uni-filters"></div></div><div class="filter-group"><strong>Pierre</strong><select class="form-control" id="stone-filter"><option value="">Toutes</option></select></div><div class="filter-group"><strong>Disponibilité</strong><div class="filter-list" id="availability-filters"></div></div><button class="btn btn-full" id="reset-filters">Réinitialiser</button></aside><main><input class="form-control" id="shop-search" placeholder="Rechercher un bijou, une pierre, un univers…"><div class="shop-toolbar"><strong id="result-count"></strong><select class="form-control" id="sort" style="max-width:220px"><option value="default">Notre sélection</option><option value="new">Nouveautés</option><option value="best">Best-sellers</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select></div><div class="products-grid" id="shop-products"></div></main></div></section><div id="site-footer"></div><script src="assets/js/products.js"></script><script src="assets/js/app.js"></script><script>let audience='';document.addEventListener('DOMContentLoaded',()=>setTimeout(initShop,0));function initShop(){PRODUCT_FILTERS.categories.forEach(x=>addCheck('cat-filters','category',x));PRODUCT_FILTERS.univers.forEach(x=>addCheck('uni-filters','universe',x));PRODUCT_FILTERS.availability.forEach(x=>addCheck('availability-filters','availability',x));PRODUCT_FILTERS.stones.forEach(s=>document.getElementById('stone-filter').insertAdjacentHTML('beforeend',`<option>${s}</option>`));document.querySelectorAll('.audience-tab').forEach(b=>b.onclick=()=>{audience=b.dataset.audience;document.querySelectorAll('.audience-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()});document.querySelectorAll('#shop-search,#stone-filter,#sort').forEach(x=>x.addEventListener('input',apply));document.querySelectorAll('.filters input').forEach(x=>x.addEventListener('change',apply));document.getElementById('reset-filters').onclick=()=>{document.querySelectorAll('.filters input').forEach(x=>x.checked=false);document.getElementById('stone-filter').value='';document.getElementById('shop-search').value='';audience='';document.querySelectorAll('.audience-tab').forEach(x=>x.classList.toggle('active',!x.dataset.audience));apply()};const q=new URLSearchParams(location.search);if(q.get('search'))document.getElementById('shop-search').value=q.get('search');if(q.get('audience')){audience=q.get('audience');document.querySelectorAll('.audience-tab').forEach(x=>x.classList.toggle('active',x.dataset.audience===audience))}if(q.get('category')){const box=document.querySelector(`input[name=category][value="${q.get('category')}"]`);if(box)box.checked=true}apply()}function addCheck(id,name,x){document.getElementById(id).insertAdjacentHTML('beforeend',`<label><input type="checkbox" name="${name}" value="${x.id}"> ${x.label}</label>`)}function checked(n){return [...document.querySelectorAll(`input[name=${n}]:checked`)].map(x=>x.value)}function apply(){let ps=searchProducts(document.getElementById('shop-search').value);const cats=checked('category'),unis=checked('universe'),avail=checked('availability'),stone=document.getElementById('stone-filter').value;if(cats.length)ps=ps.filter(p=>cats.includes(p.category));if(unis.length)ps=ps.filter(p=>unis.some(u=>p.univers.includes(u)));if(avail.length)ps=ps.filter(p=>avail.includes(p.availability));if(stone)ps=ps.filter(p=>p.stones.includes(stone));if(audience)ps=ps.filter(p=>p.audience.includes(audience));const sort=document.getElementById('sort').value;if(sort==='asc')ps.sort((a,b)=>a.price-b.price);if(sort==='desc')ps.sort((a,b)=>b.price-a.price);if(sort==='new')ps.sort((a,b)=>Number(b.new)-Number(a.new));if(sort==='best')ps.sort((a,b)=>Number(b.bestseller)-Number(a.bestseller));document.getElementById('result-count').textContent=`${ps.length} création${ps.length>1?'s':''}`;document.getElementById('shop-products').innerHTML=ps.length?ps.map(card).join(''):'<div class="empty-state">Aucune création ne correspond à ces filtres.</div>'}function card(p){return `<article class="product-card"><div class="product-image-wrap"><div class="badge-row">${p.new?'<span class="badge">Nouveau</span>':''}${p.bestseller?'<span class="badge">Best-seller</span>':''}</div><a href="product.html?id=${p.id}"><img class="product-image" src="${p.mainImage}" alt="${escapeHtml(p.name)}"></a></div><div class="product-body"><div class="product-meta">${p.categoryLabel} · ${p.stone}</div><h3><a href="product.html?id=${p.id}">${p.name}</a></h3><div class="product-price">${formatPrice(p.price)}</div><div class="product-actions"><button class="btn btn-primary" onclick="addToCart('${p.id}')">Ajouter</button><button class="btn" onclick="toggleWishlist('${p.id}',this)">${isInWishlist(p.id)?'♥':'♡'}</button></div></div></article>`}</script></body></html>
