<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Byssus Tenebrarum — bijoux et parures artisanales en micro-macramé."><title>Panier · Byssus Tenebrarum</title><link rel="icon" href="assets/images/favicon.jpg"><link rel="stylesheet" href="assets/css/style.css"></head><body data-page=""><div id="site-header"></div><section class="page-hero hero-small"><div class="wrap"><div class="page-hero-content"><div class="eyebrow">Votre sélection</div><h1>Panier</h1></div></div></section><section class="section"><div class="wrap cart-layout"><div id="cart-list" class="cart-list"></div><aside class="card summary-card"><h2>Récapitulatif</h2><div class="summary-line"><span>Sous-total</span><strong id="subtotal"></strong></div><div class="summary-line"><span>Livraison</span><strong id="shipping"></strong></div><div class="summary-line" id="gift-line" hidden><span>Emballage cadeau</span><strong>4,90 €</strong></div><div class="summary-line" id="discount-line" hidden><span>Réduction</span><strong id="discount"></strong></div><div class="summary-line total"><span>Total TTC</span><strong id="total"></strong></div><label style="display:flex;gap:8px;margin:16px 0"><input type="checkbox" id="gift"> Emballage cadeau (+4,90 €)</label><div style="display:grid;grid-template-columns:1fr auto;gap:8px"><input class="form-control" id="promo" placeholder="Code promo"><button class="btn" id="apply-promo">Appliquer</button></div><p class="muted" id="shipping-note"></p><a class="btn btn-primary btn-full" id="checkout-link" href="checkout.html">Passer à la commande</a></aside></div></section><div id="site-footer"></div><script src="assets/js/products.js"></script><script src="assets/js/app.js"></script><script>const FREE=90,SHIP=6.9,GIFT=4.9;let promo=readStorageObject(BYSSUS_CONFIG.storageKeys.promo);document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{document.getElementById('gift').checked=!!readStorageObject(BYSSUS_CONFIG.storageKeys.cartOptions).giftWrap;document.getElementById('gift').onchange=render;document.getElementById('apply-promo').onclick=applyPromo;render()},0));function render(){const cart=getCart(),box=document.getElementById('cart-list');if(!cart.length){box.innerHTML='<div class="empty-state"><h2>Votre panier est vide</h2><a class="btn btn-primary" href="shop.html">Découvrir la boutique</a></div>';document.getElementById('checkout-link').style.pointerEvents='none';document.getElementById('checkout-link').style.opacity='.45'}else{box.innerHTML=cart.map(i=>{const p=getProductById(i.id);if(!p)return'';return `<article class="cart-item"><img src="${p.mainImage}"><div><h3><a href="product.html?id=${p.id}">${p.name}</a></h3><div class="product-meta">${p.stone} · ${p.size}</div><div class="product-price">${formatPrice(p.price)}</div></div><div><div class="quantity"><button onclick="change('${p.id}',-1)">−</button><strong>${i.quantity}</strong><button onclick="change('${p.id}',1)">+</button></div><strong>${formatPrice(p.price*i.quantity)}</strong><br><button class="btn" style="margin-top:8px" onclick="removeFromCart('${p.id}');render()">Supprimer</button></div></article>`}).join('')}totals()}function change(id,n){const item=getCart().find(x=>x.id===id);if(item){setCartQuantity(id,item.quantity+n);render()}}function calcSubtotal(){return getCart().reduce((s,i)=>{const p=getProductById(i.id);return s+(p?p.price*i.quantity:0)},0)}function discountAmount(sub){return promo?.type==='percent'?sub*promo.value/100:0}function totals(){const sub=calcSubtotal(),ship=sub>=FREE||sub===0?0:SHIP,gift=document.getElementById('gift').checked?GIFT:0,disc=discountAmount(sub),total=Math.max(0,sub+ship+gift-disc);document.getElementById('subtotal').textContent=formatPrice(sub);document.getElementById('shipping').textContent=ship?formatPrice(ship):'Offerte';document.getElementById('gift-line').hidden=!gift;document.getElementById('discount-line').hidden=!disc;document.getElementById('discount').textContent='−'+formatPrice(disc);document.getElementById('total').textContent=formatPrice(total);document.getElementById('shipping-note').textContent=sub&&sub<FREE?`Plus que ${formatPrice(FREE-sub)} pour la livraison offerte.`:'Livraison standard offerte à partir de 90 €.';writeStorage(BYSSUS_CONFIG.storageKeys.cartOptions,{giftWrap:!!gift,giftPrice:gift,promo,discount:disc,shipping:ship,subtotal:sub,total})}function applyPromo(){const code=document.getElementById('promo').value.trim().toUpperCase(),codes={BIENVENUE10:{type:'percent',value:10},TENEBRES15:{type:'percent',value:15}};promo=codes[code]?{code,...codes[code]}:{};writeStorage(BYSSUS_CONFIG.storageKeys.promo,promo);showToast(codes[code]?'Code promo appliqué.':'Code non valide.',codes[code]?'success':'error');totals()}</script></body></html>
