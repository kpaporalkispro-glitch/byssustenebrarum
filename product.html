<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Byssus Tenebrarum — bijoux et parures artisanales en micro-macramé."><title>Produit · Byssus Tenebrarum</title><link rel="icon" href="assets/images/favicon.jpg"><link rel="stylesheet" href="assets/css/style.css"></head><body data-page="shop"><div id="site-header"></div><section class="page-hero hero-small"><div class="wrap"><div class="page-hero-content"><div class="eyebrow">Fiche création</div><h1 id="hero-product-name">Bijou Byssus Tenebrarum</h1></div></div></section><section class="section"><div class="wrap"><div id="product-root"></div></div></section><div id="site-footer"></div><script src="assets/js/products.js"></script><script src="assets/js/app.js"></script><script>let product=null,index=0,qty=1;document.addEventListener('DOMContentLoaded',()=>setTimeout(load,0));function load(){product=getProductById(currentProductId());if(!product){document.getElementById('product-root').innerHTML='<div class="empty-state"><h2>Création introuvable</h2><a class="btn btn-primary" href="shop.html">Retour boutique</a></div>';return}document.title=`${product.name} · Byssus Tenebrarum`;document.getElementById('hero-product-name').textContent=product.name;render()}function render(){document.getElementById('product-root').innerHTML=`<div class="product-layout"><div class="gallery"><div class="thumbs">${product.images.map((im,i)=>`<button class="thumb ${i===index?'active':''}" onclick="setImage(${i})"><img src="${im}"></button>`).join('')}</div><img class="main-product-image" id="main-image" src="${product.images[index]}" alt="${escapeHtml(product.name)}"></div><div class="product-info"><div class="eyebrow">${product.categoryLabel}</div><h1>${product.name}</h1><div class="product-meta">${product.stone} · ${product.audience.join(' · ')}</div><div class="product-price">${formatPrice(product.price)}</div><p>${product.description}</p><h3>Pierres</h3><div class="option-pills">${product.stones.map(x=>`<span class="option-pill">${x}</span>`).join('')}</div><h3>Couleurs</h3><div class="option-pills">${product.colors.map(x=>`<span class="option-pill">${x}</span>`).join('')}</div><div class="quantity"><button onclick="changeQty(-1)">−</button><strong id="qty">${qty}</strong><button onclick="changeQty(1)">+</button></div><button class="btn btn-primary btn-full" onclick="addToCart('${product.id}',qty)">Ajouter au panier</button><button class="btn btn-full" style="margin-top:8px" onclick="toggleWishlist('${product.id}',this)">${isInWishlist(product.id)?'♥ Dans mes favoris':'♡ Ajouter aux favoris'}</button><p class="muted">${product.leadTime}</p></div></div><div class="detail-tabs"><button class="active" onclick="tab('description',this)">Description</button><button onclick="tab('materials',this)">Matériaux</button><button onclick="tab('symbolism',this)">Symbolique</button><button onclick="tab('care',this)">Entretien</button></div><div class="detail-panel active card" id="description">${product.description}</div><div class="detail-panel card" id="materials"><ul>${product.materials.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="detail-panel card" id="symbolism">${product.symbolism}</div><div class="detail-panel card" id="care">${product.care}</div><div class="section-title" style="margin-top:60px"><h2>Vous aimerez aussi</h2></div><div class="products-grid">${PRODUCTS.filter(p=>p.id!==product.id).slice(0,4).map(p=>`<article class="product-card"><a href="product.html?id=${p.id}"><img class="product-image" src="${p.mainImage}"></a><div class="product-body"><h3>${p.name}</h3><div class="product-price">${formatPrice(p.price)}</div></div></article>`).join('')}</div>`}function setImage(i){index=i;render()}function changeQty(n){qty=Math.max(1,qty+n);document.getElementById('qty').textContent=qty}function tab(id,b){document.querySelectorAll('.detail-panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.detail-tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}</script></body></html>
