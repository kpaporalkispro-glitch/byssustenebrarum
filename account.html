<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Byssus Tenebrarum — bijoux et parures artisanales en micro-macramé."><title>Mon compte · Byssus Tenebrarum</title><link rel="icon" href="assets/images/favicon.jpg"><link rel="stylesheet" href="assets/css/style.css"></head><body data-page=""><div id="site-header"></div><section class="page-hero hero-small"><div class="wrap"><div class="page-hero-content"><div class="eyebrow">Espace personnel</div><h1>Mon compte</h1></div></div></section><section class="section"><div class="wrap account-layout"><aside class="card account-sidebar"><h3 id="account-name">Bienvenue</h3><p class="muted" id="account-email"></p><nav class="account-nav"><button class="active" data-panel="profile">Mon profil</button><button data-panel="orders">Mes commandes</button><button data-panel="wishlist" id="favoris">Mes favoris</button><button data-panel="address">Mon adresse</button></nav><p class="muted">Version locale GitHub Pages : les données restent sur cet appareil.</p></aside><main><section class="account-panel active" id="panel-profile"><div class="card"><h2>Mes informations</h2><div class="form-grid"><div class="form-group"><label>Prénom</label><input class="form-control" id="pf-firstname"></div><div class="form-group"><label>Nom</label><input class="form-control" id="pf-lastname"></div><div class="form-group"><label>E-mail</label><input class="form-control" id="pf-email"></div><div class="form-group"><label>Téléphone</label><input class="form-control" id="pf-phone"></div></div><button class="btn btn-primary" id="save-profile" style="margin-top:14px">Enregistrer</button></div></section><section class="account-panel" id="panel-orders"><div class="card"><h2>Mes commandes</h2><div id="orders-list" class="orders-list"></div></div></section><section class="account-panel" id="panel-wishlist"><div class="card"><h2>Mes favoris</h2><div id="wishlist-grid" class="wishlist-grid"></div></div></section><section class="account-panel" id="panel-address"><div class="card"><h2>Mon adresse</h2><div id="address-preview"></div><a class="btn" href="checkout.html" style="margin-top:14px">Modifier lors d’une commande</a></div></section></main></div></section><div id="site-footer"></div><script src="assets/js/products.js"></script><script src="assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>setTimeout(initAccount,0));function initAccount(){document.querySelectorAll('.account-nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.account-nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.account-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('panel-'+b.dataset.panel).classList.add('active')});if(location.hash==='#favoris')document.querySelector('[data-panel=wishlist]').click();const c=readStorageObject(BYSSUS_CONFIG.storageKeys.customer);document.getElementById('account-name').textContent=[c.firstname,c.lastname].filter(Boolean).join(' ')||'Bienvenue';document.getElementById('account-email').textContent=c.email||'Votre espace Byssus Tenebrarum';[['pf-firstname','firstname'],['pf-lastname','lastname'],['pf-email','email'],['pf-phone','phone']].forEach(([id,k])=>document.getElementById(id).value=c[k]||'');document.getElementById('save-profile').onclick=()=>{const n={...c,firstname:document.getElementById('pf-firstname').value,lastname:document.getElementById('pf-lastname').value,email:document.getElementById('pf-email').value,phone:document.getElementById('pf-phone').value};writeStorage(BYSSUS_CONFIG.storageKeys.customer,n);showToast('Profil enregistré.','success');location.reload()};renderOrders();renderWishlist();document.getElementById('address-preview').innerHTML=c.address?`<p>${escapeHtml(c.firstname||'')} ${escapeHtml(c.lastname||'')}<br>${escapeHtml(c.address)}${c.address2?'<br>'+escapeHtml(c.address2):''}<br>${escapeHtml(c.postalCode||'')} ${escapeHtml(c.city||'')}</p>`:'<p class="muted">Aucune adresse enregistrée.</p>';document.addEventListener('byssus:wishlist-updated',renderWishlist)}function renderOrders(){const os=readStorageArray(BYSSUS_CONFIG.storageKeys.orders),box=document.getElementById('orders-list');box.innerHTML=os.length?os.map(o=>`<article class="card"><div class="summary-line"><strong>${o.orderId}</strong><span>${new Date(o.createdAt).toLocaleDateString('fr-FR')}</span></div>${o.items.map(i=>{const p=getProductById(i.id);return p?`<div class="order-product"><img src="${p.mainImage}"><span>${p.name} × ${i.quantity}</span><strong>${formatPrice(p.price*i.quantity)}</strong></div>`:''}).join('')}<div class="summary-line total"><span>Total</span><strong>${formatPrice(o.totals.total)}</strong></div></article>`).join(''):'<div class="empty-state">Aucune commande enregistrée.</div>'}function renderWishlist(){const ps=getWishlist().map(getProductById).filter(Boolean),box=document.getElementById('wishlist-grid');box.innerHTML=ps.length?ps.map(p=>`<article class="product-card"><a href="product.html?id=${p.id}"><img class="product-image" src="${p.mainImage}"></a><div class="product-body"><h3>${p.name}</h3><div class="product-price">${formatPrice(p.price)}</div><div class="product-actions"><button class="btn btn-primary" onclick="addToCart('${p.id}')">Ajouter</button><button class="btn" onclick="toggleWishlist('${p.id}',this);renderWishlist()">Retirer</button></div></div></article>`).join(''):'<div class="empty-state">Aucun favori pour le moment.</div>'}</script></body></html>
